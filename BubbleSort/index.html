<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BubbleSort</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Bubble Sort</h1>

        <div class="bars">
            <span style="background-color: orangered;"></span>
            <span style="background-color: green;"></span>
            <span style="background-color: fuchsia;"></span>
            <span style="background-color: magenta;"></span>
            <span style="background-color: grey;"></span>
            <span style="background-color: maroon;"></span>
            <span style="background-color: yellow;"></span>
            <span style="background-color: rebeccapurple;"></span>
            <span style="background-color: cyan;"></span>
            <span style="background-color: orchid;"></span>
        </div>

        <div class="btns">
            <button id="generateBars">Generate Bars</button>
            <button id="sort" onclick="bubbleSort()">Bubble Sort</button>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
